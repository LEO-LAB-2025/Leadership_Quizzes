<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeaderLens</title>
  <style>
    :root {
      --card: #ffffff;
      --text: #2d3748;
      --accent: #667eea;
      --accent-2: #764ba2;
      --border: #e2e8f0;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      line-height: 1.6;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 28px;
    }

    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 2rem;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.2;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }

    .intro {
      margin: 12px auto 0;
      max-width: 760px;
      text-align: center;
      color: #4a5568;
      font-size: clamp(1rem, 2.2vw, 1.12rem);
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 24px;
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
    }

    .quiz-card {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 90px;
      padding: 18px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
      border: 1px solid var(--border);
      border-left: 5px solid var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      text-decoration: none;
      color: var(--text);
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .quiz-card:hover {
      transform: translateY(-2px);
      border-left-color: var(--accent-2);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
    }

    @media (max-width: 640px) {
      .page {
        padding: 12px;
      }

      .hero {
        padding: 1.25rem;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>LeaderLens</h1>
      <p class="intro">
        This page gives you quick access to each leadership quiz. Pick a quiz to explore leadership behaviors, get your score, and view your profile insights.
      </p>

      <div class="grid" aria-label="Quiz links">
        <a class="quiz-card" href="quiz_1/index.html">Quiz 1</a>
        <a class="quiz-card" href="quiz_3/index.html">Quiz 3</a>
        <a class="quiz-card" href="quiz_4/index.html">Quiz 4</a>
        <a class="quiz-card" href="quiz_5/index.html">Quiz 5</a>
        <a class="quiz-card" href="quiz_6/index.html">Quiz 6</a>
        <a class="quiz-card" href="quiz_7/index.html">Quiz 7</a>
        <a class="quiz-card" href="quiz_8/index.html">Quiz 8</a>
        <a class="quiz-card" href="quiz_9/index.html">Quiz 9</a>
        <a class="quiz-card" href="quiz_10/index.html">Quiz 10</a>
        <a class="quiz-card" href="quiz_11/index.html">Quiz 11</a>
        <a class="quiz-card" href="quiz_12/index.html">Quiz 12</a>
        <a class="quiz-card" href="quiz_13/index.html">Quiz 13</a>
        <a class="quiz-card" href="quiz_14/index.html">Quiz 14</a>
      </div>
    </section>
  </main>
</body>
</html>
